<!DOCTYPE html>
<html>
<head>
    <title>Ali Rajabi — Portfolio Agent</title>
    <style>
        * { box-sizing: border-box; }
        body {
            background: #12121a;
            color: #e8dcc0;
            font-family: -apple-system, "Segoe UI", sans-serif;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .avatar-wrap {
            position: relative;
            width: 180px;
            height: 180px;
            margin-bottom: 24px;
        }
        .avatar-glow {
            position: absolute;
            inset: -20px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(212,175,55,0.25) 0%, transparent 70%);
        }
        .avatar-wrap img {
            position: relative;
            width: 180px;
            height: 180px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #d4af37;
        }
        h1 {
            font-size: 22px;
            font-weight: 600;
            margin: 0 0 4px;
            text-align: center;
        }
        .subtitle {
            color: #9a8f7a;
            font-size: 14px;
            margin: 0 0 32px;
            text-align: center;
        }
        #chat-box {
            width: 100%;
            max-width: 560px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
            min-height: 60px;
        }
        .msg {
            padding: 12px 16px;
            border-radius: 18px;
            max-width: 75%;
            font-size: 15px;
            line-height: 1.5;
        }
        .msg.user {
            align-self: flex-end;
            background: #1e5f74;
            color: #eef6f5;
            border-bottom-right-radius: 4px;
        }
        .msg.claude {
            align-self: flex-start;
            background: #1a2951;
            color: #e8dcc0;
            border: 1px solid #d4af37;
            border-bottom-left-radius: 4px;
        }
        .msg.thinking {
            align-self: flex-start;
            background: #1a2951;
            border: 1px solid #d4af37;
            border-bottom-left-radius: 4px;
            display: flex;
            gap: 4px;
            padding: 14px 18px;
        }
        .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #d4af37;
            animation: bounce 1.2s infinite;
        }
        .dot:nth-child(2) { animation-delay: 0.2s; }
        .dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes bounce {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
            30% { transform: translateY(-4px); opacity: 1; }
        }
        .input-row {
            width: 100%;
            max-width: 560px;
            display: flex;
            gap: 10px;
        }
        #user-input {
            flex: 1;
            padding: 12px 16px;
            border-radius: 24px;
            border: 1px solid #3a3a4a;
            background: #1a1a24;
            color: #e8dcc0;
            font-size: 15px;
            outline: none;
        }
        #user-input:focus {
            border-color: #d4af37;
        }
        button {
            padding: 12px 24px;
            border-radius: 24px;
            border: none;
            background: #d4af37;
            color: #12121a;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
        }
        button:hover {
            background: #e6c358;
        }
    </style>
</head>
<body>
    <div class="avatar-wrap">
        <div class="avatar-glow"></div>
        <img src="{{ url_for('static', filename='images/avatar.jpeg') }}" alt="Ali Rajabi">
    </div>
    <h1>Ali Rajabi</h1>
    <p class="subtitle">Ask me about my background, projects, and skills</p>
    
    <a href="{{url_for('static', filename='files/resume.pdf')}}" target="_blank" style="display: inline-block; margin-bottom: 24px; padding: 8px 20px; border-radius: 20px; border: 1px solid #d4af37; color: #d4af37; text-decoration: none; font-size: 13px; font-weight: 600;">
        View full resume (PDF)
    </a>

    <div id="chat-box"></div>

    <div class="input-row">
        <input type="text" id="user-input" placeholder="Ask a question..." onkeypress="if(event.key==='Enter') sendMessage()">
        <button onclick="sendMessage()">Send</button>
    </div>

    <script>
        function sendMessage() {
            const input = document.getElementById("user-input");
            const message = input.value.trim();
            if (!message) return;

            const chatBox = document.getElementById("chat-box");
            chatBox.innerHTML += `<div class="msg user">${message}</div>`;
            input.value = "";

            const thinkingId = "thinking-" + Date.now();
            chatBox.innerHTML += `<div class="msg thinking" id="${thinkingId}"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>`;
            chatBox.scrollTop = chatBox.scrollHeight;

            fetch("/chat", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ message: message })
            })
            .then(response => response.json())
            .then(data => {
                const thinkingEl = document.getElementById(thinkingId);
                thinkingEl.outerHTML = `<div class="msg claude">${data.reply}</div>`;
                chatBox.scrollTop = chatBox.scrollHeight;
            });
        }
    </script>
</body>
</html>
