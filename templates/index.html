{% extends "base.html" %}
{% block title %}Ali Rajabi — Chat{% endblock %}
{% block content %}

<style>
    .solar-system {
        position: relative;
        width: 320px;
        height: 320px;
        margin-bottom: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    .orbit-ring {
        position: absolute;
        top: 50%;
        left: 50%;
        border: 1px dashed #2a2a38;
        border-radius: 50%;
        transform: translate(-50%, -50%);
        pointer-events: none;
    }
    .orbit-1 { width: 180px; height: 180px; }
    .orbit-2 { width: 260px; height: 260px; }

    .planet {
        position: absolute;
        border-radius: 50%;
        background: #1a1a24;
        display: flex;
        align-items: center;
        justify-content: center;
        text-decoration: none;
        font-family: sans-serif;
        font-weight: 700;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .planet:hover {
        transform: scale(1.15);
        box-shadow: 0 0 16px rgba(212,175,55,0.4);
    }

    .planet-linkedin {
        width: 48px; height: 48px;
        border: 2px solid #0A66C2;
        color: #0A66C2;
        font-size: 13px;
        top: 68px; left: 240px;
    }
    .planet-github {
        width: 40px; height: 40px;
        border: 2px solid #e8dcc0;
        color: #e8dcc0;
        font-size: 11px;
        top: 210px; left: 254px;
    }
    .planet-handshake {
        width: 32px; height: 32px;
        border: 2px solid #d4af37;
        color: #d4af37;
        font-size: 9px;
        top: 224px; left: 46px;
    }

    .avatar-wrap {
        position: relative;
        width: 180px;
        height: 180px;
        z-index: 1;
    }
    .avatar-glow {
        position: absolute;
        inset: -20px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(212,175,55,0.25) 0%, transparent 70%);
    }
    .avatar-wrap img {
        position: relative;
        width: 180px;
        height: 180px;
        border-radius: 50%;
        object-fit: cover;
        border: 2px solid #d4af37;
    }
    h1 {
        font-size: 22px;
        font-weight: 600;
        margin: 0 0 4px;
        text-align: center;
    }
    .subtitle {
        color: #9a8f7a;
        font-size: 14px;
        margin: 0 0 20px;
        text-align: center;
    }
    .resume-link {
        display: inline-block;
        margin-bottom: 24px;
        padding: 8px 20px;
        border-radius: 20px;
        border: 1px solid #d4af37;
        color: #d4af37;
        text-decoration: none;
        font-size: 13px;
        font-weight: 600;
    }
    #chat-box {
        width: 100%;
        max-width: 560px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        margin-bottom: 20px;
        min-height: 60px;
    }
    .msg {
        padding: 12px 16px;
        border-radius: 18px;
        max-width: 75%;
        font-size: 15px;
        line-height: 1.5;
    }
    .msg.user {
        align-self: flex-end;
        background: #1e5f74;
        color: #eef6f5;
        border-bottom-right-radius: 4px;
    }
    .msg.claude {
        align-self: flex-start;
        background: #1a2951;
        color: #e8dcc0;
        border: 1px solid #d4af37;
        border-bottom-left-radius: 4px;
    }
    .msg.thinking {
        align-self: flex-start;
        background: #1a2951;
        border: 1px solid #d4af37;
        border-bottom-left-radius: 4px;
        display: flex;
        gap: 4px;
        padding: 14px 18px;
    }
    .dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #d4af37;
        animation: bounce 1.2s infinite;
    }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce {
        0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
        30% { transform: translateY(-4px); opacity: 1; }
    }
    .input-row {
        width: 100%;
        max-width: 560px;
        display: flex;
        gap: 10px;
    }
    #user-input {
        flex: 1;
        padding: 12px 16px;
        border-radius: 24px;
        border: 1px solid #3a3a4a;
        background: #1a1a24;
        color: #e8dcc0;
        font-size: 15px;
        outline: none;
    }
    #user-input:focus {
        border-color: #d4af37;
    }
    button {
        padding: 12px 24px;
        border-radius: 24px;
        border: none;
        background: #d4af37;
        color: #12121a;
        font-weight: 600;
        font-size: 15px;
        cursor: pointer;
    }
    button:hover {
        background: #e6c358;
    }
</style>

<div class="solar-system">
    <div class="orbit-ring orbit-1"></div>
    <div class="orbit-ring orbit-2"></div>

    <div class="avatar-wrap">
        <div class="avatar-glow"></div>
        <img src="{{ url_for('static', filename='images/avatar.jpeg') }}" alt="Ali Rajabi">
    </div>

    <a href="https://www.linkedin.com/in/ali-mounim-rajabi/" target="_blank" class="planet planet-linkedin">in</a>
    <a href="https://github.com/alimounim" target="_blank" class="planet planet-github">GH</a>
    <a href="https://uta.joinhandshake.com/profiles/ali-mounim-rajabi" target="_blank" class="planet planet-handshake">HS</a>
</div>

<h1>Ali Rajabi</h1>
<p class="subtitle">Ask me about my background, projects, and skills</p>
<a href="{{ url_for('static', filename='files/resume.pdf') }}" target="_blank" class="resume-link">View full résumé (PDF)</a>

<div id="chat-box"></div>

<div class="input-row">
    <input type="text" id="user-input" placeholder="Ask a question..." onkeypress="if(event.key==='Enter') sendMessage()">
    <button onclick="sendMessage()">Send</button>
</div>

<script>
    function sendMessage() {
        const input = document.getElementById("user-input");
        const message = input.value.trim();
        if (!message) return;

        const chatBox = document.getElementById("chat-box");
        chatBox.innerHTML += `<div class="msg user">${message}</div>`;
        input.value = "";

        const thinkingId = "thinking-" + Date.now();
        chatBox.innerHTML += `<div class="msg thinking" id="${thinkingId}"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>`;
        chatBox.scrollTop = chatBox.scrollHeight;

        fetch("/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ message: message })
        })
        .then(response => response.json())
        .then(data => {
            const thinkingEl = document.getElementById(thinkingId);
            thinkingEl.outerHTML = `<div class="msg claude">${marked.parse(data.reply)}</div>`;
            chatBox.scrollTop = chatBox.scrollHeight;
        });
    }
</script>

{% endblock %}
